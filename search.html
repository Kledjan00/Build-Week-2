<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Cerca</title>
    <!-- Bootstrap 5 (solo CSS) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <!-- Stile EpiTunes: sempre DOPO Bootstrap -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div class="app">
      <!-- Riempita via JS in common.js. Nascosta sotto i 576px (d-none d-sm-block) -->
      <aside class="sidebar d-none d-sm-block"></aside>

      <main class="main">
        <header class="topbar sticky-top d-flex align-items-center justify-content-between px-4 py-3">
          <div class="d-flex gap-2">
            <button type="button" class="btn nav-btn rounded-circle p-0" aria-label="Indietro">‹</button>
            <button type="button" class="btn nav-btn rounded-circle p-0" aria-label="Avanti">›</button>
          </div>
          <div class="user-pill rounded-pill fw-semibold">Studente Epicode</div>
        </header>

        <section class="search page">
          <div class="search-box mt-2 mb-3">
            <input
              type="text"
              id="search-input"
              class="form-control rounded-pill border-0 search-input"
              placeholder="Cerca un brano, un album, un artista..."
              autocomplete="off"
            />
          </div>

          <!--
            COSTRUISCI IN search.js:
            - Debounce 400ms su "input" -> chiamata fetch a iTunes search
            - Tre sezioni: brani, album, artisti (Promise.all con entity differenti)
            - Salva ultima query in localStorage; al caricamento, riprendila
            - Click su brano -> Player; click su album/artist -> album.html/artist.html?id=...
          -->
          <div class="search-results">
            <section class="music-row" id="row-tracks" hidden>
              <h2>Brani</h2>
              <div class="grid" id="grid-tracks"></div>
            </section>
            <section class="music-row" id="row-albums" hidden>
              <h2>Album</h2>
              <div class="grid" id="grid-albums"></div>
            </section>
            <section class="music-row" id="row-artists" hidden>
              <h2>Artisti</h2>
              <div class="grid" id="grid-artists"></div>
            </section>
          </div>
        </section>

      </main>

      <!-- Riempito via JS in common.js -->
      <footer class="player"></footer>
    </div>

    <audio id="audio-element"></audio>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/search.js"></script>
  </body>
</html>
