<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Artista</title>
    <!-- Bootstrap 5 (solo CSS) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <!-- Stile EpiTunes: sempre DOPO Bootstrap -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <!-- Icone del tema vintage: sprite SVG, si usano con <svg class="icon"><use href="#ico-..."></use></svg> -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="ico-home" viewBox="0 0 24 24">
        <path d="M3 11.5 12 4l9 7.5" />
        <path d="M5.5 10v9.5h13V10" />
        <path d="M10 19.5v-5h4v5" />
      </symbol>
      <symbol id="ico-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <circle cx="10.5" cy="10.5" r="4" opacity="0.45" />
        <path d="M15.5 15.5 20.5 20.5" stroke-width="2.5" />
      </symbol>
      <symbol id="ico-chevron-left" viewBox="0 0 24 24">
        <path d="M14.5 5.5 8 12l6.5 6.5" />
      </symbol>
      <symbol id="ico-chevron-right" viewBox="0 0 24 24">
        <path d="M9.5 5.5 16 12l-6.5 6.5" />
      </symbol>
      <symbol id="ico-shuffle" viewBox="0 0 24 24">
        <path d="M3 7h3.5c4 0 6.5 10 10.5 10H21" />
        <path d="M3 17h3.5c1.6 0 2.9-1.6 4-3.5" />
        <path d="M13.5 10.5c1.1-1.9 2.4-3.5 4-3.5H21" />
        <path d="M18.5 4.5 21 7l-2.5 2.5" />
        <path d="M18.5 14.5 21 17l-2.5 2.5" />
      </symbol>
      <symbol id="ico-prev" viewBox="0 0 24 24">
        <path d="M6 5v14" />
        <path d="M18 5.5 8.5 12l9.5 6.5z" fill="currentColor" />
      </symbol>
      <symbol id="ico-next" viewBox="0 0 24 24">
        <path d="M18 5v14" />
        <path d="M6 5.5l9.5 6.5L6 18.5z" fill="currentColor" />
      </symbol>
      <symbol id="ico-repeat" viewBox="0 0 24 24">
        <path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19" />
        <path d="M16 3l3 3-3 3" />
        <path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5" />
        <path d="M8 21l-3-3 3-3" />
      </symbol>
      <symbol id="ico-volume" viewBox="0 0 24 24">
        <path d="M4 9.5h3l5-4v13l-5-4H4z" />
        <path d="M15.5 9a4 4 0 0 1 0 6" />
        <path d="M18 6.5a7.5 7.5 0 0 1 0 11" />
      </symbol>
    </svg>

    <div class="app">
      <!-- Sidebar statica: nascosta sotto i 576px (d-none d-sm-block) -->
      <aside class="sidebar d-none d-sm-block">
        <a href="index.html" class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">EpiTunes</span>
        </a>

        <nav class="sidebar-nav" aria-label="Navigazione principale">
          <a href="index.html" class="active"><span class="ico" aria-hidden="true"><svg class="icon"><use href="#ico-home"></use></svg></span><span>Home</span></a>
          <a href="search.html"><span class="ico" aria-hidden="true"><svg class="icon"><use href="#ico-search"></use></svg></span><span>Cerca</span></a>
        </nav>

        <h2 class="sidebar-section-title">I tuoi preferiti</h2>
        <!-- Unica parte dinamica: la lista viene riempita via JS dai preferiti in localStorage -->
        <ul class="sidebar-list" id="sidebar-favourites">
          <li class="fst-italic">Nessuno ancora</li>
        </ul>
      </aside>

      <main class="main">
        <header class="topbar sticky-top d-flex align-items-center justify-content-between px-4 py-3">
          <div class="d-flex gap-2">
            <button type="button" class="btn nav-btn rounded-circle p-0" aria-label="Indietro"><svg class="icon"><use href="#ico-chevron-left"></use></svg></button>
            <button type="button" class="btn nav-btn rounded-circle p-0" aria-label="Avanti"><svg class="icon"><use href="#ico-chevron-right"></use></svg></button>
          </div>
          <!-- Barra di ricerca nell'header: è un link a search.html disegnato come il campo di ricerca -->
          <a href="search.html" class="topbar-search" aria-label="Vai alla ricerca">
            <svg class="icon search-ico" aria-hidden="true"><use href="#ico-search"></use></svg>
            <span class="topbar-search-text">Cerca un brano, un album, un artista...</span>
          </a>
          <div class="user-action">
            <button type="button" class="btn-new-user rounded-pill fw-semibold" id="btn-new-user">+ New user</button>
            <div class="user-pill rounded-pill fw-semibold">Studente Epicode</div>
          </div>
        </header>

        <!--
          COSTRUISCI IN artist.js:
          - Leggi l'id dalla query string con URLSearchParams
          - fetch lookup?id=NNN&entity=song&limit=10
          - Primo risultato = artist, gli altri = top tracks
          - Hero: titolo artista grande + genere + numero ascoltatori (inventato/random)
          - Lista popolare di top tracks (righe .track-row, come nell'album); click su brano -> Player
        -->
        <section class="artist-page page">
          <div class="artist-hero" id="artist-hero"></div>
          <div class="top-tracks tracklist" id="top-tracks"></div>
        </section>

      </main>

      <!-- Player: scritto nell'HTML e sostituito da Player.mount() in common.js quando il JS parte
           (replaceChildren: il player non si duplica) -->
      <footer class="player">
        <div class="player-track">
          <div class="player-cover" id="player-cover"><img id="player-cover-img" alt="" /></div>
          <div class="player-meta">
            <p class="player-title" id="player-title">Seleziona un brano</p>
            <p class="player-artist" id="player-artist">—</p>
          </div>
        </div>

        <div class="player-center">
          <div class="player-controls">
            <button type="button" class="btn-ctrl" id="btn-shuffle" aria-label="Riproduzione casuale"><svg class="icon"><use href="#ico-shuffle"></use></svg></button>
            <button type="button" class="btn-ctrl" id="btn-prev" aria-label="Brano precedente"><svg class="icon"><use href="#ico-prev"></use></svg></button>
            <button type="button" class="btn-play" id="btn-play" aria-label="Riproduci">▶</button>
            <button type="button" class="btn-ctrl" id="btn-next" aria-label="Brano successivo"><svg class="icon"><use href="#ico-next"></use></svg></button>
            <button type="button" class="btn-ctrl" id="btn-repeat" aria-label="Ripeti"><svg class="icon"><use href="#ico-repeat"></use></svg></button>
          </div>
          <div class="player-progress">
            <span id="time-current">0:00</span>
            <div class="progress-bar" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <div class="player-right">
          <span class="volume-ico" aria-hidden="true"><svg class="icon"><use href="#ico-volume"></use></svg></span>
          <div class="volume-bar" id="volume-bar">
            <div class="volume-fill" id="volume-fill" style="width: 80%"></div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Modale "New user" (work in progress) -->
  <div id="modal-new-user"></div>

  <audio id="audio-element"></audio>

    <script type="module" src="assets/js/common.js"></script>
    <script type="module" src="assets/js/artist.js"></script>
  </body>
</html>
