<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Album</title>
    <!-- Bootstrap 5 (solo CSS) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <!-- Stile EpiTunes: sempre DOPO Bootstrap -->
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div class="app">
      <!-- Riempita via JS in common.js. Nascosta sotto i 576px (d-none d-sm-block) -->
      <aside class="sidebar d-none d-sm-block"></aside>

      <main class="main">
        <header class="topbar sticky-top d-flex align-items-center justify-content-between px-4 py-3">
          <div class="d-flex gap-2">
            <button type="button" class="btn nav-btn rounded-circle p-0" aria-label="Indietro">‹</button>
            <button type="button" class="btn nav-btn rounded-circle p-0" aria-label="Avanti">›</button>
          </div>
          <div class="user-pill rounded-pill fw-semibold">Studente Epicode</div>
        </header>

        <!--
          COSTRUISCI IN album.js:
          - Leggi l'id dalla query string con URLSearchParams
          - fetch lookup?id=NNN&entity=song
          - Primo risultato = collection (album), gli altri = tracks
          - Hero: cover grande + titolo album + artista + anno + numero brani
          - Tracklist: lista numerata di brani con titolo + durata; click su brano -> Player
        -->
        <section class="album-page page">
          <div class="album-hero" id="album-hero"></div>
          <div class="tracklist" id="tracklist"></div>
        </section>

      </main>

      <!-- Riempito via JS in common.js -->
      <footer class="player"></footer>
    </div>

    <audio id="audio-element"></audio>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/album.js"></script>
  </body>
</html>
